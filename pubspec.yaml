name: flutter_application_3
description: "NurisGo - Sistem Absensi Santri PPPM Nuris"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  mobile_scanner: ^5.0.0
  firebase_messaging: ^15.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  dio: ^5.7.0
  open_filex: ^4.5.0
  path_provider: ^2.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  firebase_core_platform_interface: ^6.0.3

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"